data:
  master_cv: ~/CV/Master_CV_Data.json
  publications: ~/CV/publications.bib
  output_dir: ~/CV/cv-builder
llm:
  default_provider: copilot-sdk
  default_model: gpt-5-mini
  temperature: 0.7
  max_tokens: null
  request_timeout_seconds: 300

api_keys:
  github_token:      ""
  openai_api_key:    ""
  anthropic_api_key: ""
  gemini_api_key:    ""
  groq_api_key:      ""
generation:
  base_font_size: 13px
  max_skills: 20
  max_achievements: 5
  max_publications: 10
  max_publication_pages: null          # page-based cap; overrides count limit when set
  publication_chars_per_page: 1500     # calibration: ~10 citations ≈ 4 pages
  page_margin: 0.5in
  page_count:
    warn_single: true
    ideal_min: 2
    ideal_max: 3
    absolute_max: 4
  formats:
    ats_docx: true
    human_pdf: true
    human_docx: true
  skills_section_title: Skills

# Position-style presets (issue #131).
# Extends / overrides the built-in defaults (industry, academic, government)
# from scripts/utils/config.py. Each key is selectable via position_style_override
# and is auto-detected from the job description when its domain_terms match.
position_styles:
  medical_clinical:
    label: Medical / Clinical
    page_warn_below: 2.0
    page_warn_above: null        # no upper page limit
    include_publications: true
    include_teaching: true
    domain_terms:
      - medical
      - healthcare
      - hospital
      - nurse
      - nursing
      - physician
      - pharmac
      - patient care
      - clinical operations
  industry_research:
    label: Industry Research / Applied R&D
    page_warn_below: 2.0
    page_warn_above: 4.0
    include_publications: true
    include_teaching: false
    domain_terms:
      - applied scientist
      - research scientist
      - research engineer
      - r&d
      - industry research
      - staff scientist
      - principal scientist
session:
  auto_save: true
  session_dir: ~/CV/cv-builder/sessions
  history_file: ~/CV/cv-builder/input_history
web:
  host: 127.0.0.1
  port: 5001
  debug: false
logging:
  level: DEBUG
  file: cv-builder.log
  log_dir: ~/CV/cv-builder/logs
error_reporting:
  enabled: true
  developer_email: greg@warnes-innovations.com
  smtp:
    host: localhost
    port: 25
    use_tls: false
    username: ""
    password: ""
  rate_limit_minutes: 60          # min interval between reports for the same error fingerprint
  create_dump: true               # write full reproduction zip to dump_dir on each error
  dump_dir: ~/CV/cv-builder/error_dumps
  email_attach_dump: false        # attach the dump zip to the email (may be large)
