name: Full Integration Suite

on:
  push:
    branches: [main, feature/multi-user-deployment]
  schedule:
    # Nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    uses: ./.github/workflows/reusable-codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install pytest

      - name: Run Python unit tests
        run: python -m pytest -q tests/unit

  js-tests:
    uses: ./.github/workflows/reusable-js-unit-tests.yml
    permissions:
      contents: read

  integration-harness:
    needs: [python-tests, js-tests]
    uses: ./.github/workflows/reusable-html-harness.yml
    permissions:
      contents: read

  python-full:
    name: Python full test suite
    runs-on: ubuntu-latest
    needs: [python-tests, js-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install pytest

      - name: Start stub web server
        run: |
          python scripts/web_app.py --llm-provider stub --port 5001 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5001/api/status > /dev/null 2>&1 && echo "Server up" && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5001/api/status > /dev/null
        env:
          FLASK_ENV: testing

      - name: Run Python test suite
        run: |
          mkdir -p test-results
          python -m pytest tests/ \
            --ignore=tests/ui \
            --deselect tests/test_api_integration.py::TestModelAPI::test_model_switch_error_uses_selected_provider_label \
            -q --tb=short \
            --junit-xml=test-results/python-full.xml
        env:
          CV_SERVER_URL: http://127.0.0.1:5001

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-full-results
          path: test-results/

  playwright-e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    needs: python-full
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install pytest pytest-playwright

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: |
          mkdir -p test-results
          python -m pytest tests/ui/ \
            -v --tb=short \
            --junit-xml=test-results/playwright-e2e.xml
        env:
          CV_SERVER_URL: http://127.0.0.1:5002
          FLASK_ENV: testing

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: test-results/

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-output/
