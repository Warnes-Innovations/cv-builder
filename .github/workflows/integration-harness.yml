name: PR - Unit Tests and HTML Harness

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  codeql:
    uses: ./.github/workflows/reusable-codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install pytest

      - name: Run Python unit tests
        run: |
          mkdir -p test-results
          python -m pytest -q \
            --ignore=tests/ui \
            --deselect tests/test_api_integration.py::TestModelAPI::test_model_switch_error_uses_selected_provider_label \
            --junit-xml=test-results/python-pr.xml \
            tests/

      - name: Upload Python test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-pr-results
          path: test-results/

  js-tests:
    uses: ./.github/workflows/reusable-js-unit-tests.yml
    permissions:
      contents: read

  lint:
    name: Lint (ruff + bundle verification)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff lint
        run: ruff check scripts/ --select E,F,W --ignore E501,E402

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Verify JS bundle builds
        run: npm run build

  integration-harness:
    needs: [python-tests, js-tests]
    uses: ./.github/workflows/reusable-html-harness.yml
    permissions:
      contents: read

  pr-summary:
    name: PR failure digest
    runs-on: ubuntu-latest
    needs: [codeql, python-tests, js-tests, lint, integration-harness]
    if: always()
    permissions:
      pull-requests: write
    steps:
      - name: Collect job results and write summary
        env:
          CODEQL_STATUS:    ${{ needs.codeql.result }}
          PYTHON_STATUS:    ${{ needs.python-tests.result }}
          JS_STATUS:        ${{ needs.js-tests.result }}
          LINT_STATUS:      ${{ needs.lint.result }}
          HARNESS_STATUS:   ${{ needs.integration-harness.result }}
        run: |
          icon() { [ "$1" = "success" ] && echo "✅" || [ "$1" = "skipped" ] && echo "⏭️" || echo "❌"; }

          {
            echo "## PR Check Summary"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| CodeQL | $(icon $CODEQL_STATUS) \`$CODEQL_STATUS\` |"
            echo "| Python tests | $(icon $PYTHON_STATUS) \`$PYTHON_STATUS\` |"
            echo "| JS tests | $(icon $JS_STATUS) \`$JS_STATUS\` |"
            echo "| Lint | $(icon $LINT_STATUS) \`$LINT_STATUS\` |"
            echo "| Integration harness | $(icon $HARNESS_STATUS) \`$HARNESS_STATUS\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Post failure comment on PR
        if: >
          needs.python-tests.result == 'failure' ||
          needs.js-tests.result == 'failure' ||
          needs.lint.result == 'failure' ||
          needs.integration-harness.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const statuses = {
              'Python tests':          '${{ needs.python-tests.result }}',
              'JS tests':              '${{ needs.js-tests.result }}',
              'Lint':                  '${{ needs.lint.result }}',
              'Integration harness':   '${{ needs.integration-harness.result }}',
            };
            const failed = Object.entries(statuses)
              .filter(([, v]) => v === 'failure')
              .map(([k]) => `- **${k}** — check the [Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details`)
              .join('\n');
            const body = `### ❌ CI checks failed\n\n${failed}\n\n> Re-run after fixing the issues above. See [CONTRIBUTING.md](CONTRIBUTING.md) for local test commands.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
