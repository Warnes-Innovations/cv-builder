name: PR - Unit Tests and HTML Harness

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    uses: ./.github/workflows/reusable-codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install pytest

      - name: Run Python unit tests
        run: |
          mkdir -p test-results
          python -m pytest -q \
            --ignore=tests/ui \
            --deselect tests/test_api_integration.py::TestModelAPI::test_model_switch_error_uses_selected_provider_label \
            --junit-xml=test-results/python-pr.xml \
            tests/

      - name: Upload Python test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-pr-results
          path: test-results/

  js-tests:
    uses: ./.github/workflows/reusable-js-unit-tests.yml
    permissions:
      contents: read

  lint:
    name: Lint (ruff + bundle verification)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff lint
        run: ruff check scripts/ --select E,F,W --ignore E501,E402

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Verify JS bundle builds
        run: npm run build

  integration-harness:
    needs: [python-tests, js-tests]
    uses: ./.github/workflows/reusable-html-harness.yml
    permissions:
      contents: read
