# Pytest configuration.
#
# testpaths scopes collection to the tests/ directory. Running bare `pytest`
# from the repo root without this collects scripts/test_llm.py, which is a
# standalone script (it calls sys.exit(0) at import time) and crashes pytest
# with a SystemExit during collection.
[pytest]
testpaths = tests
pythonpath = . scripts
norecursedirs =
    .git
    node_modules
    .venv
    venv
    __pycache__
markers =
    e2e: End-to-end tests that exercise the full application stack through a browser
